# Monthly grouped version updates. Security updates are a repository setting
# and cover every ecosystem, the Cargo crates included.
#
# The crates have no version-update entry: crates/tokenizer builds the committed
# tokenizer asset, which only release readiness rebuilds, so a routine bump
# would leave that asset stale. The Claude Agent SDK is ignored because a bump
# needs a live Claude engine test, so it stays a deliberate change.
version: 2
updates:
  # Only minor and patch bumps of ordinary packages share the routine group, so
  # one breaking package never blocks the rest. Every package that the routine
  # group excludes and no other group claims, and every major bump, arrives as
  # its own pull request. That pull request is the notice that an update is
  # available: closing it skips only that release, and the next release opens
  # a new one. Such packages break on minor releases or need a live check, so
  # their upgrade is a deliberate change: effect and the provider SDKs, whose
  # bumps change provider traffic. Update types alone cannot separate them,
  # because Dependabot counts a 0.x bump and a prerelease-to-release bump as
  # minor.
  #
  # @types/vscode is ignored because it must not exceed engines.vscode, which
  # vsce enforces; raising it raises the oldest supported editor.
  #
  # Major Babel bumps are ignored because babel-preset-solid, which the web
  # client compiles with, declares a peer of @babel/core 7. Remove the rule
  # once the preset accepts the new major.
  #
  # web-tree-sitter is ignored because @opentui/core pins it as an exact peer
  # and builds that version into its parser worker; it moves by hand in the
  # opentui upgrade that raises the peer.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 15
    groups:
      routine:
        patterns: ["*"]
        exclude-patterns:
          - "effect"
          - "@anthropic-ai/sdk"
          - "openai"
          - "@opentui/*"
          - "solid-js"
          - "babel-preset-solid"
          - "oxlint"
          - "@oxlint/*"
          - "ultracite"
          - "knip"
          - "eslint-plugin-solid"
        update-types: ["minor", "patch"]
      # @opentui/solid pins solid-js exactly, so they move together.
      opentui:
        patterns: ["@opentui/*", "solid-js", "babel-preset-solid"]
      # Lint tool bumps add findings, which one pull request fixes together.
      lint:
        patterns: ["oxlint", "@oxlint/*", "ultracite", "knip", "eslint-plugin-solid"]
    ignore:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
      - dependency-name: "@types/vscode"
      - dependency-name: "web-tree-sitter"
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # Benchmark tasks pin the historical Python environment of each task by hash,
  # and their copy ledgers check those bytes, so a bump breaks the task rather
  # than fixing a shipped dependency. `ignore` also governs security updates;
  # `exclude-paths` governs version updates only.
  - package-ecosystem: pip
    directories: ["/bench/tasks/**"]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
