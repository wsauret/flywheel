# Monthly grouped version updates. Security updates are a repository setting
# and cover every ecosystem, the Cargo crates included.
#
# The crates have no version-update entry: crates/tokenizer builds the committed
# tokenizer asset, which only release readiness rebuilds, so a routine bump
# would leave that asset stale. The Claude Agent SDK is ignored because a bump
# needs a live Claude engine test, so it stays a deliberate change.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      bun:
        patterns: ["*"]
    ignore:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # Benchmark tasks pin the historical Python environment of each task by hash,
  # and their copy ledgers check those bytes, so a bump breaks the task rather
  # than fixing a shipped dependency. `ignore` also governs security updates;
  # `exclude-paths` governs version updates only.
  - package-ecosystem: pip
    directories: ["/bench/tasks/**"]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
