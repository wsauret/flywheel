# Flywheel config of the OpenRouter-only DeepSeek 1017 max-effort arm, matched
# to the FrontierHarness v1.1 board (frontierharness.org): every harness there
# runs DeepSeek-V4.1-Flash-1017 at max effort, served by Baseten, 62 tasks x 4
# attempts. This arm runs the same model at max effort on every role, over the
# same tasks and attempts.
#
# Known differences from the board:
# - Route. Every request goes through OpenRouter, restricted to Baseten's
#   standard endpoint with no fallback, so Baseten serves every attempt. Every
#   other provider module is disabled. Use this arm when the Baseten account's
#   own rate limit is too low for the run's concurrency.
# - Cost. The run's own cost is at OpenRouter's prices for Baseten, which are
#   close to but not the same as Baseten's list prices. Compare cost per pass
#   with the board by repricing each trial's tokens at Baseten's list price.
# - Effort. Max on every role, including the short title-generation role.
#
# Workflows and the reviewer and ship agent types stay on, as Flywheel ships
# them. Only the advisor is off. The workflow agent, reviewer, and ship roles
# are set to the chat route because their defaults name other models.
#
# The launcher validates this file with Flywheel's config schema before any
# trial, records its sha256 in run_manifest.json, and installs it in the trial
# as $HOME/.flywheel/flywheel.toml. The trial exports its credentials under the
# neutral auth profile id "benchmark", so the profile tables below apply. The
# snapshot carries only the OpenRouter credential.

allow_persistent_processes = true
# Headless shell commands write in place; the guard that stops a write
# outside the project would refuse ordinary task setup such as package installs.
shell_write_guard = false
idle_compaction = false
auto_delete_session_days = 0

disabled_modules = [
  "ask-user",
  "bug-reports",
  "code-mode",
  "development",
  "experiments",
  "learning",
  "mcp",
  "papercuts",
  "project-notifications",
  "provider-anthropic-api",
  "provider-baseten",
  "provider-claude-agent-sdk",
  "provider-github-copilot",
  "provider-google-api",
  "provider-google-vertex",
  "provider-openai-api",
  "provider-chatgpt",
  "provider-deepseek",
  "provider-opencode-go",
  "provider-supergrok",
  "remote",
  "side-question",
  "web",
  "web-chatgpt",
  "web-exa",
]

# The advisor gives a second opinion from another model, which a run of one
# model cannot give. Every other agent type stays on.
[subagents]
disabled_types = ["advisor"]

[updates]
auto_install = false

[profiles.benchmark]
allow_training_routes = false

# The board runs one model in a trial, so automatic titles use the chat route too.
# "baseten" matches every Baseten endpoint, so its 2x-priced fast tier is excluded by name.
[profiles.benchmark.roles.chat]
model = "deepseek-v4.1-flash-1017"
effort = "max"
provider_options = { openrouter = { only = ["baseten"], ignore = ["baseten/fast"], allow_fallbacks = false } }

[profiles.benchmark.roles.explorer]
model = "deepseek-v4.1-flash-1017"
