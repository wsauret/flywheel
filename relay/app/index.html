<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Images come only from the page itself and from the data the client holds,
     so text that names an image on another host makes no request to it.
     Scripts, styles, and connections stay open: the client loads from the
     relay the phone pairs with, which can be any host. -->
<meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flywheel">
<title>Flywheel</title>
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/bootstrap.css">
</head>
<body>
<!-- The bootstrap stamps the loaded client's identity and the host contract
     on #root before the client's own script runs. -->
<div id="root" data-version="__VERSION__"></div>
<script src="/bootstrap.js"></script>
</body>
</html>
