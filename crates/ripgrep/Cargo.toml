[package]
name = "flywheel-ripgrep"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi10"] }
napi-derive = "3"
grep-regex = "0.1"
grep-matcher = "0.1"
pcre2-sys = "0.2"
grep-searcher = "0.1"
globset = "0.4"
ignore = "0.4"
memchr = "2"
rayon = "1.10"
smallvec = "1.15"
memmap2 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
napi-build = "2"
